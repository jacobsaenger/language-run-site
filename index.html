<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language Run</title>
<style>
  :root { --bg: #FDF7EC; --ink: #2B2118; --secondary: #8A7A66; --clay: #C4643B; }
  @media (prefers-color-scheme: dark) { :root { --bg: #221B12; --ink: #EFE6D4; --secondary: #B3A48C; --clay: #DD8557; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: grid; place-items: center; min-height: 100vh; padding: 24px; text-align: center; }
  h1 { font-size: 2.6rem; font-weight: 900; letter-spacing: -0.03em; line-height: 1; margin: 0; }
  h1 span { color: var(--clay); }
  p { color: var(--secondary); max-width: 42ch; }
  a { color: var(--clay); }
  nav { margin-top: 18px; }
</style>
</head>
<body>
<div>
  <h1>LANGUAGE<br><span>RUN</span></h1>
  <p>An endless runner that teaches vocabulary while a pack of dogs chases you. Eleven languages, fully offline, no ads, no accounts.</p>
